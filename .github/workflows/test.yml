name: Tests

on:
  push:
    branches: [main]
    paths: ['pipeline/**', 'site/**', 'tests/**', 'scripts/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch community dataset for integration tests
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/olbauday/FPL-Elo-Insights.git /tmp/community
          cd /tmp/community && git sparse-checkout set data/2026-2027
      - name: Unit and integration tests
        env:
          COMMUNITY_DATA: /tmp/community
        run: node --test tests/*.test.js
      - name: Live provider smoke test (real FPL API, read-only)
        run: |
          node --input-type=module -e "
          const r = await fetch('https://fantasy.premierleague.com/api/bootstrap-static/');
          if (!r.ok) throw new Error('FPL API HTTP ' + r.status);
          const b = await r.json();
          const spurs = b.teams.find(t => t.name === 'Spurs');
          console.log('FPL API reachable:', b.elements.length, 'players; Spurs id', spurs && spurs.id);
          "
