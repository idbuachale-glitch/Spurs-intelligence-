name: Sync data and publish

on:
  schedule:
    - cron: '7,27,47 * * * *'   # every 20 minutes (off the hour to avoid GitHub's busiest minutes)
    - cron: '2,12,17,22,32,37,42,52,57 * * * *'   # extra 5-minute runs; only proceed from 100 min before a Spurs match (line-ups) to full time
  workflow_dispatch:
    inputs:
      force:
        description: 'Run every job now, ignoring the schedule'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'pipeline/**', '.github/workflows/sync.yml']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # The extra 5-minute schedule only does work while a Spurs match is in play.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: site/data
      - name: Live-window gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "7,27,47 * * * *" ]; then
            node -e '
              const fs=require("fs");const cur=JSON.parse(fs.readFileSync("site/data/seasons.json")).current;
              const fx=JSON.parse(fs.readFileSync(`site/data/seasons/${cur}/fixtures.json`)).fixtures;
              const now=Date.now();const live=fx.some(f=>f.kickoff&&!f.friendly&&(now-Date.parse(f.kickoff))/60000>=-100&&(now-Date.parse(f.kickoff))/60000<=155);
              process.stdout.write(live?"go=1":"go=0");' >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  sync:
    needs: gate
    if: needs.gate.outputs.go == '1'
    concurrency:
      group: sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    outputs:
      rc: ${{ steps.run.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fast-changing bookkeeping (schedule, health counters, latest raw snapshot) lives in
      # the Actions cache between runs; everything durable is committed to the repository.
      - name: Restore run state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/scheduler.json
            state/raw
            site/data/status.json
            site/data/meta.json
          key: run-state-${{ github.run_id }}
          restore-keys: run-state-

      - name: Run sync
        id: run
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPPLEMENTARY_STATS: ${{ vars.SUPPLEMENTARY_STATS || 'on' }}
          FORCE_ALL: ${{ inputs.force && '1' || '0' }}
        run: |
          set +e
          node pipeline/sync.js
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # rc 1 = could not produce any dataset; rc 2 = persistent source failure (data still published)
          if [ "$rc" = "1" ]; then exit 1; fi
          exit 0

      - name: Save run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/scheduler.json
            state/raw
            site/data/status.json
            site/data/meta.json
          key: run-state-${{ github.run_id }}

      - name: Commit data changes
        run: |
          git config user.name "spurs-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data state
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          # Commit football-data changes immediately; bookkeeping-only changes at most every 3 hours.
          meaningful=$(git diff --cached --name-only | grep -vE '^(site/data/(status|meta)\.json|state/scheduler\.json|state/raw/)' | wc -l)
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ "$meaningful" = "0" ] && [ $((now - last)) -lt 10800 ]; then echo "Only bookkeeping changed; skipping commit"; git reset -q; exit 0; fi
          git commit -q -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X ours && git push -q && break; sleep 5; done

      - name: Prepare site
        # Version every code file with the commit, so phones load a new release
        # immediately instead of a cached copy of the previous one.
        run: |
          cp -r site _site && touch _site/.nojekyll
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"styles\.css)\"#\1?v=$v\"#; s#(src=\"app\.js)\"#\1?v=$v\"#" _site/index.html
          sed -i -E "s#from '\./([a-z]+\.js)'#from './\1?v=$v'#g" _site/*.js
          grep -q "app.js?v=$v" _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Flag persistent source failure
        if: steps.run.outputs.rc == '2'
        run: |
          echo "::error::A data source has failed repeatedly. The site is still serving the last valid data; see the Data sources page."
          exit 1
